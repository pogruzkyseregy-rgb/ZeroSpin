name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          if [ -f ZeroSpin.zip ]; then
            unzip -o ZeroSpin.zip -d tmp -x 'ZeroSpin/.github/*'
            cp -r tmp/ZeroSpin/. .
            rm -rf tmp
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ZeroSpin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroSpin-apk
          path: ZeroSpin.apk

name: Unzip
on:
  push:
    paths: ['ZeroSpin.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o ZeroSpin.zip -d tmp
          cp -r tmp/ZeroSpin/. .
          rm -rf tmp ZeroSpin.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Распаковка проекта"
          git push
